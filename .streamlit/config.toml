# Demo teması (açık): kırık beyaz zemin, koyu gri metin, tek yumuşak vurgu rengi (yumuşak lacivert).
# Parlak ve doygun renkler yalnız anomali vurgusunda kullanılır (app/theme.py).
[theme]
base = "light"
primaryColor = "#3D5A80"
backgroundColor = "#FAFAF7"
secondaryBackgroundColor = "#F0F0EA"
textColor = "#2F3437"
font = "sans serif"

[client]
# Sayfalar app/views/ altında fonksiyon olarak durur; menü app/streamlit_app.py'de (st.navigation + st.page_link).
showSidebarNavigation = false
toolbarMode = "minimal"
